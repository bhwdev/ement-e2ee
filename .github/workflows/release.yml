name: Release

# Pushing a tag vX.Y.Z publishes the release; that push is the human gate.
# Run by hand with dry_run to build the binaries without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only build the binaries and keep them as workflow artifacts.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The versions agree
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          header=$(sed -n 's/^;; Version: \(.*\)$/\1/p' ement-e2ee.el)
          constant=$(sed -n 's/^(defconst ement-e2ee-binary-version "\(.*\)"$/\1/p' ement-e2ee.el)
          echo "Cargo.toml: $cargo; ;; Version: $header; ement-e2ee-binary-version: $constant"
          test -n "$cargo" && test "$cargo" = "$header" && test "$cargo" = "$constant"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag: $GITHUB_REF_NAME"
            test "$GITHUB_REF_NAME" = "v$cargo"
          fi
      - name: Test
        run: cargo test --locked

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install the Rust target
        run: rustup target add "$TARGET"
      - name: Build
        run: cargo build --locked --profile dist --target "$TARGET"
      - name: Smoke test
        run: |
          binary="target/$TARGET/dist/ement-e2ee"
          "$binary" --version
          "$binary" --version | grep -qx "ement-e2ee $(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          file "$binary"
          if [ "$RUNNER_OS" = Linux ]; then
            # Static, PIE or not. (ldd exits 0 on static-pie binaries, 1 on
            # other static ones: judge by what it prints.)
            libraries=$(ldd "$binary" 2>&1 || true)
            echo "ldd: $libraries"
            case "$(file "$binary")" in
              *"static-pie linked"* | *"statically linked"*) ;;
              *) echo "not statically linked"; exit 1 ;;
            esac
            case "$libraries" in
              *"statically linked"* | *"not a dynamic executable"*) ;;
              *) echo "links shared libraries"; exit 1 ;;
            esac
          else
            codesign --verify --verbose "$binary"
          fi
          ls -l "$binary"
          cp "$binary" "ement-e2ee-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ement-e2ee-${{ matrix.target }}
          path: ement-e2ee-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ement-e2ee-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum ement-e2ee-* > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ement-e2ee-*
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes
